[package]
name = "purplepie"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version, derived from the dependency graph that
# Stage 1+ will pull in (wgpu 30.0.1 -> ordered-float 5.5 requires 1.90).
# CI builds with 1.90 (the `msrv` job); development uses newer stable releases.
# See docs/TECH_STACK.md and docs/RELEASING.md.
rust-version = "1.90"
description = "PurplePie: a small, modular 2D game engine written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DavidVilela1/purplepie"
readme = "README.md"
publish = false

# The engine is a library crate; the sandbox binary is a *game* that may only
# use the public `purplepie` API. See docs/DECISIONS.md (ADR-002).
[lib]
name = "purplepie"
path = "src/lib.rs"

[[bin]]
name = "sandbox"
path = "src/main.rs"

# Each stage adds only the dependencies it uses (ADR-013).
# Versions verified on 2026-09-30 (see docs/TECH_STACK.md).
[dependencies]
# Stage 3: 2D math (ADR-007). Only the always-built f32 types (Vec2, Affine2, Mat4);
# the default "all-types" feature (f64/integer vectors) is not needed.
glam = { version = "0.33", default-features = false, features = ["std"] }
bytemuck = { version = "1.25", features = ["derive"] }  # Stage 5: instance data as bytes (ADR-019); already in the tree via wgpu
hecs = "0.11.1"      # Stage 3: ECS (ADR-006)
log = "0.4"          # Stage 4: diagnostics facade (ADR-016); already in the tree via wgpu
pollster = "1.0.1"   # Stage 4: block on wgpu init futures (ADR-012)
thiserror = "2.0.21" # Stage 1: `Error` enum (ADR-011)
wgpu = "30.0.1"      # Stage 4: GPU, used only in `render` (ADR-005)
winit = "0.30.13"    # Stage 1: window + event loop, used only in `app` (ADR-004)
image = { version = "0.25.10", default-features = false, features = ["png"] }
# PP-018a: font parsing + glyph rasterization, used only in `render` (ADR-027).
# Already in the Linux tree via winit's Wayland decorations; +4 crates on Windows.
# Variable-font support (default features) is not needed.
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
# PP-022: audio output, used only in `audio` (ADR-030). Default features only (no JACK/PulseAudio/PipeWire).
# Linux builds need the ALSA headers (`libasound2-dev`); +5 crates on Linux, +3 Windows, +9 macOS (with hound).
cpal = "0.18.2"
hound = "3.5.1"      # PP-022: WAV decoding, used only in `audio` (ADR-030)
lewton = "0.10.2"    # PP-024b: OGG Vorbis decoding, used only in `audio/sound.rs` (ADR-033); +4 crates
# PP-026a: scene files (ADR-035), used only in `scene`. +5 crates on every platform
# (`ron`, `serde`, `serde_core`, `serde_derive`, `typeid`). Since PP-027 serde's traits appear in one
# public bound (`Context::register_scene_component`, ADR-036); engine types still do not derive them.
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

# PP-030 (ADR-038): this package is also the root of a Cargo workspace. The engine stays at the
# repository root (paths, commands and `assets/` unchanged); future engine crates (debug overlay,
# editor) go under `crates/`. Example games written only against the public API live under
# `games/` (ADR-042). Plain `cargo build`/`test` at the root still builds only the engine;
# `--workspace` includes the games (CI does). Declaring the workspace also keeps Cargo from
# attaching this project to a workspace in a parent folder.
[workspace]
members = ["games/purple-swarm"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
