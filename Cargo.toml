[package]
name = "purplepie"
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version, derived from the dependency graph that
# Stage 1+ will pull in (wgpu 30.0.1 -> ordered-float 5.5 requires 1.90).
# Only Rust 1.95.0 has actually been exercised. See docs/TECH_STACK.md.
rust-version = "1.90"
description = "PurplePie: a small, modular 2D game engine written in Rust."
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

# The engine is a library crate; the sandbox binary is a *game* that may only
# use the public `purplepie` API. See docs/DECISIONS.md (ADR-002).
[lib]
name = "purplepie"
path = "src/lib.rs"

[[bin]]
name = "sandbox"
path = "src/main.rs"

# Each stage adds only the dependencies it uses (ADR-013).
# Versions verified on 2026-09-30 (see docs/TECH_STACK.md).
[dependencies]
# Stage 3: 2D math (ADR-007). Only the always-built f32 types (Vec2, Affine2, Mat4);
# the default "all-types" feature (f64/integer vectors) is not needed.
glam = { version = "0.33", default-features = false, features = ["std"] }
bytemuck = { version = "1.25", features = ["derive"] }  # Stage 5: instance data as bytes (ADR-019); already in the tree via wgpu
hecs = "0.11.1"      # Stage 3: ECS (ADR-006)
log = "0.4"          # Stage 4: diagnostics facade (ADR-016); already in the tree via wgpu
pollster = "1.0.1"   # Stage 4: block on wgpu init futures (ADR-012)
thiserror = "2.0.21" # Stage 1: `Error` enum (ADR-011)
wgpu = "30.0.1"      # Stage 4: GPU, used only in `render` (ADR-005)
winit = "0.30.13"    # Stage 1: window + event loop, used only in `app` (ADR-004)
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
