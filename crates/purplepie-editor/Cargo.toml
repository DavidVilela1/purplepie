[package]
name = "purplepie-editor"
version = "0.1.0"
edition = "2024"
# egui (through PurplePie's `egui` feature) needs Rust 1.95, so the CI `msrv`
# job (Rust 1.90) excludes this crate (ADR-044).
rust-version = "1.95"
description = "PurplePie's scene editor: opens, shows and saves scene files (ADR-044)."
license = "MIT OR Apache-2.0"
publish = false

# A `Game` on PurplePie's public API with the `egui` hook (ADR-044); it lives
# under `crates/` (ADR-038). egui comes only through `purplepie::egui`.
[dependencies]
purplepie = { path = "../..", features = ["egui"] }
# Only for the `DeserializeOwned` bound of `GameComponents::with` (PP-038j1);
# the engine already depends on serde 1, so nothing new is built.
serde = "1.0.229"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

# The guide's "a game's own editor" files (docs/GUIDE.md section 15), laid out
# like a game crate; a test keeps the guide's text identical to them.
[[example]]
name = "guide_editor"
path = "examples/guide/src/bin/editor.rs"
